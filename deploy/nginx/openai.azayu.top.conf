# openai.azayu.top 反向代理配置
# 放到 /etc/nginx/conf.d/ 或 sites-available 后 reload。
# 关键点：流式（SSE）必须关闭缓冲，否则客户端会一次性收到全部内容。

upstream azapp_gateway {
    server 127.0.0.1:8100;
    keepalive 32;
}

server {
    listen 80;
    server_name openai.azayu.top;
    # 用 certbot 签证书后会自动补 443，或手动配置 ssl 后重定向
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name openai.azayu.top;

    ssl_certificate     /etc/letsencrypt/live/openai.azayu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openai.azayu.top/privkey.pem;

    # 聊天请求体不大，限制到 2m 防止滥用
    client_max_body_size 2m;

    # 传递真实客户端 IP，用于用量日志记录来源
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- OpenAI 兼容接口 ----
    location /v1/ {
        proxy_pass http://azapp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 流式响应关键设置
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 管理后台与健康检查 ----
    location /api/ {
        proxy_pass http://azapp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # ---- 管理后台界面 ----
    location /admin {
        proxy_pass http://azapp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location = / {
        return 302 /admin;
    }
}
